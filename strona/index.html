    <title>Zegar</title>     <style>        
     body  {     margin: 0;   
       font-family: Arial, sans-serif;   
         color: rgb(87, 83, 83); background-color: black;
        } .sekcja { 
          position: relative;  
                   width: 100%; } .sekcja img {   
                      display: block;  
                         width: 100%;  
                         height: auto; } .tlo {    
                             display: block;

                             height: auto; } 
                             .zegar 
                             {     
                                position: absolute; 
                                    top: calc(50% - 250px);    
                                     left: 50%;     
                                     transform: translate(-50%, -50%) scale(0.5);   
                                       font-size: 32px;    
                                        font-weight: normal;   
                                         letter-spacing: 1px; 
                                        white-space: nowrap;}  
                                         @media (max-width: 600px)
                                          

    
             
                                         </style> 
                                         </head> 
                                         <body>      
                                             <div class="sekcja">        
                                                 <img src="tlo1.png">         
                                                 <div class="zegar">            
                                                     <span>Czas: </span>

                                                    </div>

                                                                     <script> function aktualizujZegar() {  
                                                                           const teraz = new Date();   
                                                                      const godzina = teraz.toLocaleTimeString("pl-PL", {         timeZone: "Europe/Warsaw",         hour: "2-digit",         minute: "2-digit",         second: "2-digit",       
                                                                        hour12: false     });   
                                                      const data = teraz.toLocaleDateString("pl-PL", {         timeZone: "Europe/Warsaw",         day: "numeric",         month: "numeric",         year: "numeric"     });     document.getElementById("godzina").textContent = godzina;     document.getElementById("data").textContent = data; } aktualizujZegar(); setInterval(aktualizujZegar, 1000); 

</script> </body> </html>
